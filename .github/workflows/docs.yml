name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/rust-game-simulator-xegyM
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust + wasm target
        run: |
          rustup update stable
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install trunk
        run: |
          which trunk || cargo install --locked trunk

      - name: Build rustdoc
        run: cargo doc --no-deps -p master-of-game-core
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build GUI (wasm)
        working-directory: gui
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"

      - name: Assemble dist
        run: |
          mkdir -p dist
          cp -r gui/dist/* dist/
          mkdir -p dist/docs
          cp -r target/doc/* dist/docs/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
